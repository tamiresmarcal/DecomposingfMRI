# CNeuroMod (Courtois NeuroMod) -- friends, fMRIPrep derivatives.
# https://docs.cneuromod.ca  /  https://github.com/courtois-neuromod
#
# Facts checked against the CNeuroMod docs rather than assumed:
#   - TR = 1.49 s (3T Siemens Prisma Fit).
#   - The derivatives are a SEPARATE datalad dataset, not a subdirectory of
#     `friends`: install courtois-neuromod/friends.fmriprep alongside it. The
#     docs' phrasing ("under the folder of each dataset ... derivatives/
#     fmriprep") describes the logical layout, not how it is distributed --
#     `friends` itself declares only a `stimuli` subdataset.
#   - Inside friends.fmriprep, sub-01..sub-06 sit at the REPO ROOT, so
#     derivatives_root points at that clone directly. Layout below it is
#     sub-*/ses-*/func/, with space-MNI152NLin2009cAsym desc-preproc_bold /
#     desc-brain_mask and a desc-confounds_timeseries.tsv sidecar per run.
#     Verified against sub-01/ses-001/func in the published repo.
#   - friends is one task per episode segment: task-s01e01a, s01e01b, ...
#     A subject watches many episodes across many sessions, so unlike
#     ds002837 this cohort really does use both `ses` and `task`.
#
# THE IMPORTANT DIFFERENCE FROM ds002837
# --------------------------------------
# ds002837's derivatives are afni_proc.py residuals: motion regression,
# detrending and bandpass are already baked in, and an explicit censor .1D
# ships alongside. NONE of that is true here. fMRIPrep returns preprocessed
# BOLD with confounds left as a *table* for you to apply. So this config must
# do three things that ds002837's does not:
#
#   1. regress motion    -> confounds.strategy: 24hmp (Friston-24)
#   2. band-pass          -> filtering.already_applied: false
#   3. censor by FD       -> confounds.fd_threshold, since there is no .1D
#
# Leaving any of the three off does not fail -- it silently produces
# uncleaned timeseries, which is the failure mode this comment exists to
# prevent.
#
# PATHS ARE ABSOLUTE AND SITE-SPECIFIC (Alliance/nibi, rpp-aevans-ab), and
# committed rather than left as placeholders. Elsewhere, change the three
# paths below and nothing else.
#
# derivatives_root points at the friends.fmriprep clone, whose sub-01..06 sit
# at its ROOT -- it is a sibling datalad dataset, not a subdirectory of
# `friends`. Content is fetched per file: `datalad get <path>` from OUTSIDE
# the container (datalad is not in the image). An unfetched file is a dangling
# annex symlink, which check_cohort.py names explicitly.
#
# SCOPE: all of Friends season 1, six subjects. 24 episodes x 2 halves = 48
# runs per subject, 288 in total, filtered by `task-s01e*` in bold_glob.
# The pilot that established the layout was one episode (s01e02a): verified
# 2026-08 that both sub-01 and sub-02 have it under ses-001, that the TR check
# confirms 1.49 s from the headers, and that leaves land as
# task=s01e02a/sub=01/ses-001.parquet.
#
# ON DISK AS OF 2026-09: 240 of 288. sub-04's 48 runs are tracked but their
# content was never fetched -- `datalad get` fails on them with "S3 bucket does
# not allow public access", i.e. missing AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
# not a corrupt or absent file. They are dangling annex symlinks, which DO
# match bold_glob, so sub-04 must be excluded=True in participants.csv until
# the fetch completes. Re-running extract afterwards adds it: leaves are
# skip-if-exists, so nothing already computed is redone.
#
# output_root is deliberately the SAME as every other cohort's: the `cohort=`
# key separates them inside one tree, which is what makes "one atlas, one
# window size, every cohort" a single directory to read.

cohort: cneuromod
tr: 1.49
derivatives_root: /project/6008063/tamires/cohorts/cneuromod/friends.fmriprep
output_root: /project/6008063/tamires/DecomposingfMRI/outputs
space: MNI152NLin2009cAsym
participants: /project/6008063/tamires/DecomposingfMRI/config/cneuromod_friends_participants.csv

atlases: [harvardoxford, yeo7, networks]

discovery:
  backend: glob
  # ses-* is a real directory level here, unlike ds002837.
  # task-s01e* is the SEASON FILTER, and it lives here rather than in
  # include_tasks because include_tasks is an exact-string match: season 1 is
  # 24 episodes x 2 halves, so naming it there means 48 literals to keep in
  # sync with an incrementally released dataset. The glob says the same thing
  # in one token and stays true when season 2 lands on disk.
  bold_glob: "sub-*/ses-*/func/sub-*_task-s01e*_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
  mask_glob: "sub-{sub}_*task-{task}_*space-MNI152NLin2009cAsym_desc-brain_mask.nii.gz"
  # Empty on purpose: the season filter is in bold_glob above, and a second
  # filter here would only be a place for the two to disagree. The pilot ran
  # on include_tasks: [s01e02a]; that is what this replaced.
  #
  # NOT a licence to point bold_glob at everything. Discovery globs FILENAMES
  # and never checks that the file exists -- a datalad/git-annex symlink whose
  # content was never fetched matches the glob, is discovered as a real run,
  # and fails at load time deep inside a compute job. Whatever is not on disk
  # belongs in participants.csv as excluded=True, with a reason.
  include_tasks: []

confounds:
  format: fmriprep_tsv
  strategy: 24hmp          # 6 motion params + derivatives + squares
  confounds_glob: "sub-*_task-*_desc-confounds_timeseries.tsv"
  # No censor .1D exists for fMRIPrep output, so frames are censored on
  # framewise displacement instead. 0.5 mm is a common threshold, not a law --
  # it is a choice you are making, so it is written down here explicitly.
  fd_column: framewise_displacement
  fd_threshold: 0.5
  dilate_tr: 1

filtering:
  already_applied: false   # fMRIPrep does NOT filter; this is the key flip
  bandpass: [0.01, 0.1]    # narrower than ds002837's 0.01-1.0: that upper
                           # bound came from AFNI's own preprocessing, whereas
                           # here we are choosing the band ourselves
  detrend: true
  standardize: false       # correlation is invariant to it

runs:
  mode: concat

trim:
  # TRIM AT THE SOURCE. Every run is cut to its episode's declared length
  # (stimulus.durations_s below) before parcel means are written, so the
  # activation leaf itself is uniform across subjects and nothing downstream
  # can see a volume the other subjects do not have.
  #
  # Only one run is actually affected: sub-?? on s01e12a has 472 volumes where
  # the other four have 471. For the other 239 runs n_needed == n_tr and the
  # mask keeps everything -- this is a no-op that costs one comparison.
  #
  # Doing it here rather than only capping the window grid means the fix
  # applies once, at the point the data enters the pipeline, instead of being
  # re-derived by every later stage. dfc, QC, and anything in stage 4 all read
  # the same trimmed timeseries.
  #
  # unit MUST be declared and must match what the column holds. `seconds` here
  # because end_movie is stamped from stimulus.durations_s, which is seconds.
  # 701.79 / 1.49 = 471 exactly.
  column: end_movie
  unit: seconds
  mode: end
  #
  # The column is added to participants.csv from this config's own
  # durations_s, so the two cannot drift:
  #
  #   apptainer exec --bind /project $FMRIDECOMP_SIF python - <<'EOF'
  #   import csv, yaml
  #   cfg = yaml.safe_load(open("config/cneuromod_friends.yaml"))
  #   dur = cfg["stimulus"]["durations_s"]
  #   p = "config/cneuromod_friends_participants.csv"
  #   rows = list(csv.DictReader(open(p)))
  #   for r in rows:
  #       r["end_movie"] = dur[r["task"]]
  #   cols = list(rows[0].keys())
  #   w = csv.DictWriter(open(p, "w", newline=""), fieldnames=cols)
  #   w.writeheader(); w.writerows(rows)
  #   EOF
  #
  # A run whose file is SHORTER than its declared duration raises rather than
  # padding (activation.py:256). That is the guard that will catch sub-04 if
  # any of its segments turns out shorter than the five measured here.

stimulus:
  # MEASURED FROM THE IMAGES, 2026-09: volume count x TR 1.49, per episode
  # segment, taking the MINIMUM across the five subjects who have it.
  #
  # This started empty, on the assumption that segments varied per subject the
  # way ds002837's films do. They do not. Reading all 240 headers showed the
  # acquisition is scripted: 47 of the 48 segments have an IDENTICAL volume
  # count across every subject, and the 48th (s01e12a) differs by one volume
  # in one subject -- 1.49 s. So a declared duration is both possible and
  # better here than the observed-duration fallback.
  #
  # WHY IT MATTERS, precisely. It is not about alignment: make_stimulus_grid
  # builds Window(k, k*stride, k*stride + window_s) from zero regardless, so
  # window k already covers the same seconds-since-run-start for everyone. The
  # duration sets k_max, i.e. HOW MANY windows. Leaving it empty meant the one
  # subject with 472 volumes on s01e12a could earn a window the other four
  # never get, making that episode's subject x window matrix ragged for no
  # reason. Taking the minimum makes the grid identical -- same boundaries AND
  # same count -- which is what a cross-subject contrast needs.
  #
  # MINIMUM, not maximum: the grid must never extend past the shortest
  # subject's data. The cost is 1.49 s discarded from one subject on one
  # episode; the alternative is a window that is partly empty for four.
  #
  # Note a and b are the same length in EVERY episode -- the halves are equal
  # by design, not cut at a narrative point. Episode lengths themselves vary
  # widely (460 vols / 685 s for e19-e20, up to 592 / 882 s for e01), which is
  # why this is per-task and not one cohort-wide number.
  #
  # Re-measure with:
  #   apptainer exec --bind /project $FMRIDECOMP_SIF python -c "
  #   import nibabel as nib, glob, os, re
  #   rows={}
  #   for f in sorted(glob.glob('sub-*/ses-*/func/*_task-s01e*_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz')):
  #       if not os.path.exists(f): continue
  #       rows.setdefault(re.search(r'task-(s01e\d+[ab])',f).group(1),[]).append(nib.load(f).shape[3])
  #   [print(t, min(v)*1.49, sorted(set(v))) for t,v in sorted(rows.items())]"
  #
  # sub-04 is NOT in these numbers -- its content was never fetched. When it
  # lands, re-measure: if any of its segments is SHORTER than the value here,
  # that value must come down, or sub-04 gets a window running past its data.
  durations_s:
    s01e01a: 882.08   # 592 vols
    s01e01b: 882.08   # 592 vols
    s01e02a: 718.18   # 482 vols
    s01e02b: 718.18   # 482 vols
    s01e03a: 703.28   # 472 vols
    s01e03b: 703.28   # 472 vols
    s01e04a: 749.47   # 503 vols
    s01e04b: 749.47   # 503 vols
    s01e05a: 697.32   # 468 vols
    s01e05b: 697.32   # 468 vols
    s01e06a: 727.12   # 488 vols
    s01e06b: 727.12   # 488 vols
    s01e07a: 734.57   # 493 vols
    s01e07b: 734.57   # 493 vols
    s01e08a: 709.24   # 476 vols
    s01e08b: 709.24   # 476 vols
    s01e09a: 697.32   # 468 vols
    s01e09b: 697.32   # 468 vols
    s01e10a: 739.04   # 496 vols
    s01e10b: 739.04   # 496 vols
    s01e11a: 710.73   # 477 vols
    s01e11b: 710.73   # 477 vols
    s01e12a: 701.79   # 471 vols   # 471 for 4 subjects, 472 for one -- min taken, see above
    s01e12b: 701.79   # 471 vols
    s01e13a: 697.32   # 468 vols
    s01e13b: 697.32   # 468 vols
    s01e14a: 731.59   # 491 vols
    s01e14b: 731.59   # 491 vols
    s01e15a: 710.73   # 477 vols
    s01e15b: 710.73   # 477 vols
    s01e16a: 719.67   # 483 vols
    s01e16b: 719.67   # 483 vols
    s01e17a: 719.67   # 483 vols
    s01e17b: 719.67   # 483 vols
    s01e18a: 740.53   # 497 vols
    s01e18b: 740.53   # 497 vols
    s01e19a: 685.40   # 460 vols
    s01e19b: 685.40   # 460 vols
    s01e20a: 685.40   # 460 vols
    s01e20b: 685.40   # 460 vols
    s01e21a: 710.73   # 477 vols
    s01e21b: 710.73   # 477 vols
    s01e22a: 706.26   # 474 vols
    s01e22b: 706.26   # 474 vols
    s01e23a: 688.38   # 462 vols
    s01e23b: 688.38   # 462 vols
    s01e24a: 767.35   # 515 vols
    s01e24b: 767.35   # 515 vols
  timing_source: identity
  unit_of_analysis: run

windows:
  # Segments run 685-882 s (460-592 volumes; see stimulus.durations_s, which is
  # measured, not assumed). So 300 s fits everywhere -- it just yields few
  # windows: stride is 300/5 = 60 s, giving floor((685-300)/60)+1 = 7 on the
  # shortest episode and 10 on the longest, against ~12 at 120 s and ~65 at
  # 30 s. Kept so every cohort is analysed on the same window grid; drop it
  # here if 7 windows per run is too few for what you are testing.
  #
  # Window COUNT therefore differs by episode, and that is correct: they are
  # different stimuli of different lengths. What must not differ, and does
  # not, is the count WITHIN one episode across subjects.
  sizes_s: [15, 30, 60, 120, 300]
  n_overlaps: 5
  drop_incomplete: true

  # 15 s is restricted to the same two atlases as ds002837, for the same
  # reason and one extra. At TR=1.49 a 15 s window is round(15/1.49) = 10
  # samples -- fewer than ds002837's 15, because the aperture is a stimulus
  # duration and the sampling rate is the cohort's. Ten samples say something
  # about yeo7's 21 edges and nothing about Harvard-Oxford's 6,105.
  #
  # Rows are not the problem here that they are on the films: a ~718 s segment
  # gives floor((718-15)/3)+1 = 235 windows against 7 at 300 s. Keeping the
  # restriction identical across cohorts is what keeps "one atlas, one window
  # size, every cohort" a single directory to read.
  by_size:
    15:
      atlases: [yeo7, networks]

# --- participants CSV -------------------------------------------------
# Not shipped with the repo, deliberately: unlike ds002837 (where each of the
# 86 subjects watched exactly one film, a published constant), which CNeuroMod
# episodes exist is a property of YOUR copy of an incrementally released
# dataset. Generate it from what discovery actually finds:
#
#   python tools/make_participants.py config/cneuromod_friends.yaml \
#       -o config/cneuromod_friends_participants.csv
#
# Then set `participants:` above to that ABSOLUTE path.
#
# Every generated row is excluded=False. Edit real exclusions in by hand as
# excluded=True WITH a reason -- never by deleting the row, or the validator
# can no longer tell a curation decision from an oversight.

# --- how to run -------------------------------------------------------
#   python tools/check_cohort.py config/cneuromod_friends.yaml
#   fmri-decomp extract  config/cneuromod_friends.yaml --n-jobs 4 --limit 2
#
# --no-strict is NO LONGER needed: stimulus.durations_s is populated, so
# `validate` passes clean and submit_all.sh does not prompt. If you ever see
# the 48 "no stimulus duration configured" problems again, something dropped
# durations_s -- do not answer y past it, put the durations back.
#   python tools/check_cohort.py config/cneuromod_friends.yaml --checks outputs,parallel --limit 2
#   fmri-decomp dfc      config/cneuromod_friends.yaml --dry-run
#   fmri-decomp dfc      config/cneuromod_friends.yaml --n-jobs 4
#
# Subject-level motion into participants.csv. No motion_glob is needed: with
# format: fmriprep_tsv the tool reads the framewise_displacement column
# fMRIPrep already computed, rather than recomputing it from rot_*/trans_*
# and risking the radian/degree convention.
#   python tools/make_participants.py config/cneuromod_friends.yaml \
#       -o config/cneuromod_friends_participants.csv --update --fd
