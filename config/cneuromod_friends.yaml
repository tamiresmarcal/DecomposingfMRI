# CNeuroMod (Courtois NeuroMod) -- friends, fMRIPrep derivatives.
# https://docs.cneuromod.ca  /  https://github.com/courtois-neuromod
#
# Facts checked against the CNeuroMod docs rather than assumed:
#   - TR = 1.49 s (3T Siemens Prisma Fit).
#   - The derivatives are a SEPARATE datalad dataset, not a subdirectory of
#     `friends`: install courtois-neuromod/friends.fmriprep alongside it. The
#     docs' phrasing ("under the folder of each dataset ... derivatives/
#     fmriprep") describes the logical layout, not how it is distributed --
#     `friends` itself declares only a `stimuli` subdataset.
#   - Inside friends.fmriprep, sub-01..sub-06 sit at the REPO ROOT, so
#     derivatives_root points at that clone directly. Layout below it is
#     sub-*/ses-*/func/, with space-MNI152NLin2009cAsym desc-preproc_bold /
#     desc-brain_mask and a desc-confounds_timeseries.tsv sidecar per run.
#     Verified against sub-01/ses-001/func in the published repo.
#   - friends is one task per episode segment: task-s01e01a, s01e01b, ...
#     A subject watches many episodes across many sessions, so unlike
#     ds002837 this cohort really does use both `ses` and `task`.
#
# THE IMPORTANT DIFFERENCE FROM ds002837
# --------------------------------------
# ds002837's derivatives are afni_proc.py residuals: motion regression,
# detrending and bandpass are already baked in, and an explicit censor .1D
# ships alongside. NONE of that is true here. fMRIPrep returns preprocessed
# BOLD with confounds left as a *table* for you to apply. So this config must
# do three things that ds002837's does not:
#
#   1. regress motion    -> confounds.strategy: 24hmp (Friston-24)
#   2. band-pass          -> filtering.already_applied: false
#   3. censor by FD       -> confounds.fd_threshold, since there is no .1D
#
# Leaving any of the three off does not fail -- it silently produces
# uncleaned timeseries, which is the failure mode this comment exists to
# prevent.
#
# PATHS ARE ABSOLUTE AND SITE-SPECIFIC (Alliance/nibi, rpp-aevans-ab), and
# committed rather than left as placeholders. Elsewhere, change the three
# paths below and nothing else.
#
# derivatives_root points at the friends.fmriprep clone, whose sub-01..06 sit
# at its ROOT -- it is a sibling datalad dataset, not a subdirectory of
# `friends`. Content is fetched per file: `datalad get <path>` from OUTSIDE
# the container (datalad is not in the image). An unfetched file is a dangling
# annex symlink, which check_cohort.py names explicitly.
#
# include_tasks is the WHOLE OF SEASON 1 for all six subjects: 48 episode
# segments x 6 subjects = 288 runs. Verified against the real data (2026-08)
# for the pilot -- both sub-01 and sub-02 have s01e02a under ses-001, the TR
# check genuinely confirms 1.49s from the headers, and leaves land as
# task=s01e02a/sub=01/ses-001.parquet -- and against
# courtois-neuromod/friends.fmriprep@main (2026-09) for the full season.
#
# THE CONTENT MUST BE FETCHED FIRST, and it is not small: the six subjects'
# season 1 is ~345 GiB of BOLD, because these derivatives were written with
# `--output-spaces MNI152NLin2009cAsym` and NO res- specifier, so fMRIPrep
# 20.2.6 wrote them at the template's own 1 mm grid (1.5 GB per 718 s run,
# ~3.2 MB per volume). Cam-CAN asked for res-2 and is ~40x smaller per run.
# That is a disk-quota decision before it is a pipeline one. Use
#   preprocessing/cneuromod/fetch_friends_s01.sh
# which fetches exactly the three files per run this config reads and nothing
# else -- the same runs at every other derivative (T1w space, fsLR CIFTI,
# aparcaseg, boldref, figures) would be several times that again.
#
# output_root is deliberately the SAME as every other cohort's: the `cohort=`
# key separates them inside one tree, which is what makes "one atlas, one
# window size, every cohort" a single directory to read.

cohort: cneuromod
tr: 1.49
derivatives_root: /project/6008063/tamires/cohorts/cneuromod/friends.fmriprep
output_root: /project/6008063/tamires/DecomposingfMRI/outputs
space: MNI152NLin2009cAsym
participants: /project/6008063/tamires/DecomposingfMRI/config/cneuromod_friends_participants.csv

atlases: [harvardoxford, yeo7, networks]

discovery:
  backend: glob
  # ses-* is a real directory level here, unlike ds002837.
  bold_glob: "sub-*/ses-*/func/sub-*_task-*_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
  mask_glob: "sub-{sub}_*task-{task}_*space-MNI152NLin2009cAsym_desc-brain_mask.nii.gz"
  # SEASON 1, ENTIRE, for all six subjects. Not a pilot any more.
  #
  # Enumerated rather than pattern-matched because `include_tasks` is an exact
  # membership test (cohort.py), and because an explicit list is the thing that
  # fails loudly if the fetch was partial: a task named here with no file on
  # disk is an "analysable table row with no run on disk" from validate_cohort,
  # whereas a pattern would silently analyse whatever happened to arrive.
  #
  # Verified against courtois-neuromod/friends.fmriprep@main (2026-09), not
  # assumed from the episode count: season 1 is 24 episodes x 2 segments = 48
  # tasks, and each of sub-01..06 has exactly one preproc BOLD for every one of
  # the 48 -- 288 runs, no duplicates, no missing cells. Segments never go past
  # `b` in this season.
  #
  # Sessions are NOT a filter here and must not become one: which session an
  # episode was watched in differs per subject (sub-01 has s01e01 in ses-003
  # and s01e02 in ses-001), and season 1 spans ses-001..ses-012 depending on
  # the subject. The task entity is the only stable key.
  include_tasks:
    [s01e01a, s01e01b, s01e02a, s01e02b, s01e03a, s01e03b, s01e04a, s01e04b,
     s01e05a, s01e05b, s01e06a, s01e06b, s01e07a, s01e07b, s01e08a, s01e08b,
     s01e09a, s01e09b, s01e10a, s01e10b, s01e11a, s01e11b, s01e12a, s01e12b,
     s01e13a, s01e13b, s01e14a, s01e14b, s01e15a, s01e15b, s01e16a, s01e16b,
     s01e17a, s01e17b, s01e18a, s01e18b, s01e19a, s01e19b, s01e20a, s01e20b,
     s01e21a, s01e21b, s01e22a, s01e22b, s01e23a, s01e23b, s01e24a, s01e24b]

confounds:
  format: fmriprep_tsv
  strategy: 24hmp          # 6 motion params + derivatives + squares
  confounds_glob: "sub-*_task-*_desc-confounds_timeseries.tsv"
  # No censor .1D exists for fMRIPrep output, so frames are censored on
  # framewise displacement instead. 0.5 mm is a common threshold, not a law --
  # it is a choice you are making, so it is written down here explicitly.
  fd_column: framewise_displacement
  fd_threshold: 0.5
  dilate_tr: 1

filtering:
  already_applied: false   # fMRIPrep does NOT filter; this is the key flip
  bandpass: [0.01, 0.1]    # narrower than ds002837's 0.01-1.0: that upper
                           # bound came from AFNI's own preprocessing, whereas
                           # here we are choosing the band ourselves
  detrend: true
  standardize: false       # correlation is invariant to it

runs:
  mode: concat

trim:
  column: null

stimulus:
  # Empty for the same reason as ds002837: episode segments differ in length,
  # and dfc.py falls back to each file's observed duration. Expect one
  # validation warning per task, and pass --no-strict to extract.
  durations_s: {}
  timing_source: identity
  unit_of_analysis: run

windows:
  # A friends segment is ~482 TR x 1.49 s = 718 s, so 300 s does fit -- it just
  # yields few windows: stride is 300/5 = 60 s, giving floor((718-300)/60)+1 = 7
  # windows per run, against ~12 at 120 s and ~65 at 30 s. Kept so every cohort
  # is analysed on the same window grid; drop it here if 7 windows per run is
  # too few for what you are testing.
  sizes_s: [15, 30, 60, 120, 300]
  n_overlaps: 5
  drop_incomplete: true

  # 15 s is restricted to the same two atlases as ds002837, for the same
  # reason and one extra. At TR=1.49 a 15 s window is round(15/1.49) = 10
  # samples -- fewer than ds002837's 15, because the aperture is a stimulus
  # duration and the sampling rate is the cohort's. Ten samples say something
  # about yeo7's 21 edges and nothing about Harvard-Oxford's 6,105.
  #
  # Rows are not the problem here that they are on the films: a 718 s segment
  # gives floor((718-15)/3)+1 = 235 windows against 7 at 300 s. Keeping the
  # restriction identical across cohorts is what keeps "one atlas, one window
  # size, every cohort" a single directory to read.
  by_size:
    15:
      atlases: [yeo7, networks]

# --- participants CSV -------------------------------------------------
# The checked-in table is the 288 rows above: sub-01..06 x the 48 season-1
# segments, every row excluded=False. It is shipped because for THIS season
# the (sub, task) mapping is now a constant -- all six subjects completed all
# 48 segments upstream, which was checked file by file rather than assumed.
#
# It stays a generated file for any other slice of the dataset: which
# CNeuroMod episodes exist is a property of YOUR copy of an incrementally
# released dataset, so widening `include_tasks` past season 1 means
# regenerating it from what discovery actually finds:
#
#   python tools/make_participants.py config/cneuromod_friends.yaml \
#       -o config/cneuromod_friends_participants.csv
#
# Then set `participants:` above to that ABSOLUTE path.
#
# Every generated row is excluded=False. Edit real exclusions in by hand as
# excluded=True WITH a reason -- never by deleting the row, or the validator
# can no longer tell a curation decision from an oversight.

# --- how to run -------------------------------------------------------
# The full season-1 run is in RUNBOOK.md; it is two commands. By hand:
#
#   ./preprocessing/cneuromod/fetch_friends_s01.sh --dry-run   # login node
#   ./preprocessing/cneuromod/fetch_friends_s01.sh
#   python tools/check_cohort.py config/cneuromod_friends.yaml
#   ./slurm/submit_all.sh config/cneuromod_friends.yaml 108 24
#
# `--no-strict` is required for extract on this cohort and submit_all.sh offers
# it for you: stimulus.durations_s is empty, so validate reports one problem
# per task. Smaller by hand:
#   fmri-decomp extract  config/cneuromod_friends.yaml --n-jobs 4 --no-strict --limit 2
#   python tools/check_cohort.py config/cneuromod_friends.yaml --checks outputs,parallel --limit 2
#   fmri-decomp dfc      config/cneuromod_friends.yaml --dry-run
#   fmri-decomp dfc      config/cneuromod_friends.yaml --n-jobs 4
#
# Subject-level motion into participants.csv. No motion_glob is needed: with
# format: fmriprep_tsv the tool reads the framewise_displacement column
# fMRIPrep already computed, rather than recomputing it from rot_*/trans_*
# and risking the radian/degree convention.
#   python tools/make_participants.py config/cneuromod_friends.yaml \
#       -o config/cneuromod_friends_participants.csv --update --fd
