# HCP Young Adult 7T movie-watching -- DRAFT, NOT YET VERIFIED AGAINST DATA.
#
# Unlike config/ds002837.yaml, whose header says every fact in it was confirmed
# against the dataset README, the three marked TODO blocks below are GUESSES and
# the cohort must not be run until they are settled. `check_cohort.py` catches
# the structural ones (paths, discovery, TR); it cannot catch the two that
# matter most, which are about what the files already had done to them.
#
# WHAT IS ESTABLISHED
# -------------------
#   - Four movie runs per subject, each its OWN task: MOVIE1..MOVIE4. They are
#     not four runs of one stimulus -- different films, and (see below) two
#     different scan sessions.
#   - The volumetric file is the one this pipeline can read. The *.dtseries.nii
#     are CIFTI grayordinates and stage 1 is `nib.load` + voxel membership.
#   - The concatenated `tfMRI_MOVIE_7T/` directory is deliberately NOT matched.
#     Handing the pipeline one 4-run file would make it see a single run, so a
#     120s or 300s window could straddle the junction between two different
#     films, two phase-encode directions and two scan days, with
#     `crosses_run_boundary` never firing because there is no boundary to see.
#     `MOVIE?_7T_??` requires the digit and the PE suffix, which that directory
#     has neither of.
#   - Phase encoding: MOVIE1/MOVIE4 are AP, MOVIE2/MOVIE3 are PA. HCP acquires
#     opposite-PE pairs so TOPUP can undo the distortion; after the minimal
#     preprocessing pipeline both are in the same space, so this config does not
#     branch on it. It is recorded here because PE direction, film identity and
#     scan session are ALIASED in this design -- MOVIE1+2 in one session,
#     MOVIE3+4 in another -- so a difference between movies cannot be read as a
#     stimulus effect.
#   - `space` is FSL's MNI152 (what HCP's MNINonLinear targets), NOT the
#     MNI152NLin2009cAsym of the three fMRIPrep cohorts. HarvardOxford and Yeo
#     are distributed in exactly this space, so the atlas/template match is
#     BETTER here than for the existing cohorts. The sphere-based `networks`
#     atlas is the one to check, per the README's template caveat.
#
# WHY NOT THE MSMAll CIFTI, WHICH HCP THEMSELVES RECOMMEND
# -------------------------------------------------------
# Because `model_hash` hashes the FEATURE NAMES (`edges_digest`), and
# `decompose` fits one scaler/PCA/UMAP on pooled training rows. A Glasser
# parcellation gives different columns, so this cohort could not be pooled with
# or projected onto the existing fit -- every cell would read as a different
# model. MSMAll is better WITHIN HCP; using it only here would put a
# cohort-by-atlas confound exactly where the design is trying to isolate a
# difference between MODELS. Run it, if wanted, as a separate within-HCP
# sensitivity analysis with its own --train.

cohort: hcp7t
tr: 1.0                 # TODO VERIFY. 1.0s is the published 7T movie TR, but
                        # like ds002837 this is from the protocol and not yet
                        # from the headers. check_cohort.py reports what the
                        # files actually say.

# VERIFIED 2026-10: 59 six-digit subject directories sit directly under this
# root, each holding MNINonLinear/Results/tfMRI_MOVIE<N>_7T_<PE>/. The sibling
# `test_file_connect` and `unzip_hcp.sh` do not match the glob, and could not
# be mistaken for subjects anyway since `subject_pattern` demands six digits
# followed by /MNINonLinear.
derivatives_root: /project/6008063/tamires/cohorts/hcp
output_root: /project/6008063/tamires/DecomposingfMRI/outputs
space: MNI152NLin6Asym
participants: /project/6008063/tamires/DecomposingfMRI/config/hcp7t_participants.csv

atlases: [harvardoxford, yeo7, networks]

discovery:
  backend: glob
  # Subject ids are bare 6-digit numbers with no `sub-` prefix, and there is no
  # BIDS `task-` entity, so both patterns are overridden. `subject_pattern` is
  # matched against the WHOLE path and `task_pattern` against the FILENAME only
  # (cohort.py `_discover_glob`), which is why the first anchors on the
  # directory that follows it and the second does not need to.
  bold_glob: "*/MNINonLinear/Results/tfMRI_MOVIE?_7T_??/tfMRI_MOVIE?_7T_??_hp2000_clean_rclean_tclean.nii.gz"
  # Resolved against the BOLD file's own directory -- cohort.py does
  # `path.parent.glob(mask_glob)` -- so a bare sibling name is right here,
  # where ds002837 needs `../anat/...`.
  mask_glob: "brainmask_fs.1.60.nii.gz"
  subject_pattern: "/([0-9]{6})/MNINonLinear"
  # Captures MOVIE1..MOVIE4 as the path spells them, so the partitions come out
  # `task=MOVIE1`. That is the same rule `--keep-tasks` follows everywhere else
  # ("the BIDS labels as the data spells them"); lowercasing would mean the
  # config and the filesystem disagree about the name of the same thing.
  task_pattern: "tfMRI_(MOVIE[0-9])_7T"
  # The default excludes "rest"; nothing here is named that, and the
  # concatenated directory is already excluded by the glob above.
  exclude_tasks: []

# THE FILE IS ALREADY FULLY CLEANED -- the suffixes are HCP pipeline stages,
# not someone's ad-hoc script:
#
#   hp2000   highpass at 2000s (0.0005 Hz)
#   clean    sICA + FIX
#   rclean   ReClean, HCP's automated pipeline for improved sICA artifact
#            removal on top of FIX
#   tclean   temporal ICA (tICA) cleanup, which removes global NOISE while
#            preserving global SIGNAL -- so this data has had the equivalent
#            of GSR's benefit without GSR's cost
#
# It is the END of HCP's denoising chain, and there is no more-processed file;
# the only other 4D volumetric candidates in these directories do not exist
# (the minimally-preprocessed originals are not in this copy).
#
# SO THIS COHORT GETS NO NUISANCE REGRESSION AND NO SCRUBBING, which is HCP's
# own recommendation and not an omission. Glasser: spatial and temporal ICA
# cleanup already remove head-motion effects, and regressing motion beyond that
# removes neural signal; the current recommended approach excludes scrubbing,
# GSR and CompCor-style nuisance regression alike.
#
# An earlier draft of this config regressed 24 motion parameters and censored
# at FD 0.5, to match camcan and cneuromod. That was wrong -- it would have
# undone part of what tICA bought. The measurement that looked like evidence
# for it (median R^2 = 0.0251 of the 12 motion regressors) says the opposite
# once read properly: chance for 12 predictors over ~900 TRs is ~0.013, so
# 0.0251 is twice chance, which is LOW for motion variance in fMRI. It is not
# exactly zero only because the regressors were never projected out -- ICA
# removes components, it does not subtract the columns.
filtering:
  # `already_applied` is about the BAND, and the band genuinely is not applied:
  # measured on 100610/MOVIE1, 20.8% of power sits below 0.01 Hz and 31.2%
  # above 0.1 Hz, so hp2000 is the only highpass and nothing was lowpassed.
  # Band-passing here is the ANALYSIS band every cohort ends up in, not
  # re-doing preprocessing -- ds002837 arrives with 0.01-1.0 baked in, camcan
  # and cneuromod are banded at this stage, and stage 4's --match-bandpass
  # harmonises the activation source regardless. Stage 3 has no such step, so
  # a broadband cohort there would be the odd one out.
  already_applied: false
  bandpass: [0.01, 0.1]
  detrend: true
  standardize: false

confounds:
  # Nothing, deliberately. See above.
  format: none
  strategy: none
  censor_glob: null
  # NOTE, and accept it knowingly: with no motion source this cohort has no
  # `mean_fd`, so `config/censor/motion.yaml`'s max_mean_fd and
  # min_frac_good_frames will both report NOT APPLIED for it and every subject
  # passes. That is consistent with HCP's no-scrubbing recommendation, but it
  # does mean hcp7t is gated differently from the other three and the DESIGN
  # table should say so. Movement_RelativeRMS_mean.txt holds one number per
  # run if a motion figure is wanted for reporting -- it is an RMS
  # displacement, not Power FD, so it is not comparable to the other cohorts'
  # thresholds and must not be fed to one.
  motion_glob: null
  dilate_tr: 1

stimulus:
  timing_source: identity
  # NOT `clip`, despite HCP being the cohort that key was written for. `dfc.py`
  # flags `crosses_clip_boundary` from a `clip_idx` column, and NOTHING in the
  # repo produces that column -- the branch is dead. Until it is implemented, a
  # long window will silently span the cut between two unrelated clips and the
  # rest block between them. Clip timings:
  # https://wiki.humanconnectome.org/docs/7T%20Movie%20watching%20task%20clip%20info%20timing%20versions%20shown%20per%20individual%20subject.html
  unit_of_analysis: run
  # There IS a shared stimulus, so the alignment gate is meaningful -- unlike
  # Cam-CAN's rest. But that wiki page is titled "versions shown per individual
  # subject", so confirm every subject saw the same montage before trusting a
  # FAIL here to mean misalignment rather than design.
  isc_gate_tr: 1.0
  # TODO. Left empty so stage 3 falls back to each file's observed length, which
  # is what the chain script's "--no-strict" prompt is about. Fill from the
  # headers once extraction has run.
  durations_s: {}

runs:
  mode: separate
  drop_boundary_windows: false
