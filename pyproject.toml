[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-decomposition"
version = "0.1.0"
description = "Cohort-agnostic naturalistic-viewing fMRI pipeline: activation and dynamic functional connectivity"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "nibabel>=5.0",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
atlases = ["nilearn>=0.10"]        # only needed to fetch/resample built-in atlases
bids = ["pybids>=0.16"]
test = ["pytest>=7.4"]
# Stages 5b/5c. sklearn is the estimators and the CV; matplotlib is a HARD
# requirement of `benchmark`, which always writes its two figures and has no
# flag to skip them. Both already live in containers/stage45.def, which is how
# the cluster gets them -- this extra is for a local install.
model = ["scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
fmri-decomp = "fmri_decomposition.cli:main"

[tool.setuptools.packages.find]
include = ["fmri_decomposition*"]

[tool.setuptools.package-data]
# The coordinate atlas has no fetcher: the CSV is the parcellation, so it must
# survive installation or get_atlas("networks") breaks off a checkout.
"fmri_decomposition.atlases" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
